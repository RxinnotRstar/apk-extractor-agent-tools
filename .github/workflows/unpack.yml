name: unpack

on:
  push:
    paths: ['payload.zip']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          [ -f payload.zip ] || exit 0
          unzip -oq payload.zip -d .
          rm -f payload.zip
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A && git commit -m "unpack" && git push
